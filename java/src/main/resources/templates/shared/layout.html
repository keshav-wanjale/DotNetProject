<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title th:text="${title}">Application</title>
    <link th:href="@{/css/bootstrap.css}" rel="stylesheet" />
    <link th:href="@{/css/bootstrap-theme.css}" rel="stylesheet" />
    <link th:href="@{/css/Site.css}" rel="stylesheet" />
    <script th:src="@{/js/modernizr-2.8.3.js}"></script>
</head>
<body>
    <div class="navbar navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" th:href="@{/}">Application name</a>
            </div>
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav">
                    <li><a th:href="@{/}">Home</a></li>
                    <li><a th:href="@{/error}">Error</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="container body-content">
        <div th:insert="~{::body}">Content here</div>
        <hr />
        <footer>
            <p>&copy; <span th:text="${#dates.format(new java.util.Date(), 'yyyy')}">2023</span> - My Spring Boot Application</p>
        </footer>
    </div>
    <script th:src="@{/js/jquery-3.3.1.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <div th:insert="~{::scripts}"></div>
</body>
</html>
