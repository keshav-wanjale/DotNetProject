server:
  port: 8080

spring:
  application:
    name: WebApiExample

logging:
  level:
    root: INFO

# Database configuration
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mydb
    username: user
    password: password

# JSON settings
spring:
  jackson:
    property-naming-strategy: CAMEL_CASE_TO_LOWER_CASE_WITH_UNDERSCORES

# Web API routes
spring:
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER

# Additional configurations can be added here
