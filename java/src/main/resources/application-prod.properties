# Production profile overrides
spring.profiles.active=prod

# Logging level for production
logging.level.root=WARN
logging.file.name=logs/application-prod.log

# Production datasource configuration (replace host, credentials)
spring.datasource.url=jdbc:sqlserver://prod-db-server:1433;databaseName=WebApiExample;encrypt=true;trustServerCertificate=false
spring.datasource.username=prod_user
spring.datasource.password=prod_password

# Validate schema, no auto updates
spring.jpa.hibernate.ddl-auto=validate
