spring:
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

app:
  settings:
    webpages:
      enabled: false

logging:
  level:
    root: INFO

server:
  servlet:
    context-path: /

# Database connection settings
spring:
  datasource:
    url: jdbc:mysql://ReleaseSQLServer/MyReleaseDB
    username: root
    password: password
    driver-class-name: com.mysql.jdbc.Driver

# Additional settings can be added here
